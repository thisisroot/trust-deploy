# Trust server — reverse proxy for a subdomain, alongside your existing site.
#
# Put this in /etc/nginx/sites-available/trust.conf and symlink it into
# sites-enabled/ (or drop it in /etc/nginx/conf.d/). It only claims the
# `trust.zeddm.ir` server_name, so your existing landing page is untouched.
#
# 1. Point a DNS A record: trust.zeddm.ir -> this server's IP (done: 185.164.73.67).
# 2. `sudo nginx -t && sudo systemctl reload nginx`
# 3. `sudo certbot --nginx -d trust.zeddm.ir`  ← adds the TLS/443 block + redirect.
#
# certbot rewrites this file to add `listen 443 ssl` + the certificate lines and
# an HTTP→HTTPS redirect. Start with plain :80 below.

server {
    listen 80;
    listen [::]:80;
    server_name trust.zeddm.ir;

    # Images/avatars upload as raw blobs up to 25 MB; nginx defaults to 1 MB and
    # would otherwise reject them with 413.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (used by /v0/ws for realtime messaging/presence).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep long-lived WebSockets open.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}

# Add this once, in the http{} block (e.g. /etc/nginx/nginx.conf or a snippet in
# conf.d/), so $connection_upgrade is defined. It maps a normal request to a
# "close" Connection header and a WebSocket to "upgrade":
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
